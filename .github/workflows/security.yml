name: Security

on:
  pull_request:
  schedule:
    # Every Monday: catch new advisories for the bundled vendor/ libraries
    # even when nothing in the repository changed.
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  composer-audit:
    name: Composer audit (${{ matrix.branch || github.ref_name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Scheduled runs check both release lines; other events check the current ref.
        branch: ${{ github.event_name == 'schedule' && fromJSON('["main", "6.x-dev"]') || fromJSON('[""]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.branch }}
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - name: composer audit
        run: composer audit --locked

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
